[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-pet"
version = "0.1.0"
description = "Tamagotchi-style desktop coding companion — adopt a virtual pet that levels up as you code"
readme = "README.md"
authors = [{ name = "Hermes Pets Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "websockets>=13.0",
]

[project.optional-dependencies]
# Python-side dev tooling. The Electron overlay is managed in overlay/package.json.
dev = [
  "pytest",
]

[project.scripts]
hermes-pet = "hermes_pet.cli:main"
hermes-pet-bridge = "hermes_pet.bridge:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_pet*"]
namespaces = true

[tool.setuptools.package-data]
hermes_pet = [
  "overlay/package.json",
  "overlay/src/*.js",
  "overlay/src/*.html",
  "overlay/src/*.css",
  "overlay/assets/manifest.json",
  "overlay/assets/sprites/**/*",
  "overlay/scripts/*.ps1",
]
